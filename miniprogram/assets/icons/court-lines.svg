<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 640" preserveAspectRatio="xMidYMid slice">
  <g stroke="#f0ebe0" stroke-width="1.8" fill="none" opacity="0.45">
    <!-- 双打边线（外框） -->
    <line x1="40" y1="0" x2="40" y2="640"/>
    <line x1="335" y1="0" x2="335" y2="640"/>
    <!-- 单打边线 -->
    <line x1="68" y1="0" x2="68" y2="640"/>
    <line x1="307" y1="0" x2="307" y2="640"/>
    <!-- 底线 -->
    <line x1="40" y1="580" x2="335" y2="580"/>
    <!-- 发球线（只在单打区内，不超出到双打区） -->
    <line x1="68" y1="360" x2="307" y2="360"/>
    <!-- 中线（从底线到发球线） -->
    <line x1="187.5" y1="360" x2="187.5" y2="580"/>
    <!-- 中点标记 -->
    <line x1="187.5" y1="580" x2="187.5" y2="596"/>
  </g>
</svg>
